packages:
  - "apps/*"
  - "packages/*"

# Latest-compatible floors. Keep majors that Strapi/admin still require
# (vite 6, zod 3, js-yaml 4, hono 4 / @hono/node-server 1, yaml 1).
#
# Dependency override policy (issue #13):
# - Temporary (drop after the next Strapi/MCP release that ships the floor):
#   hono, @hono/node-server, tar, vite, sharp
# - Floor pins kept even when current Strapi already matches, so a transitive
#   rollback cannot reintroduce a high finding: fast-uri, nanoid, ip-address
# - Broader supply-chain floors (keep until unused in `pnpm why`):
#   brace-expansion, esbuild, lodash, postcss, js-yaml, etc.
# Do not weaken CI `pnpm audit --audit-level high` without a written exception.
overrides:
  "@hono/node-server": "1.19.17"
  "@uiw/react-codemirror>codemirror": "^6.0.2"
  brace-expansion: "5.0.9"
  esbuild: "0.28.2"
  fast-uri: "3.1.6"
  fast-xml-parser: "5.11.1"
  flatted: "3.4.4"
  handlebars: "4.7.9"
  hono: "4.13.5"
  ip-address: "10.5.0"
  js-yaml: "4.3.2"
  linkify-it: "5.0.2"
  lodash: "4.18.1"
  lodash-es: "4.18.1"
  minimatch: "10.2.6"
  "nanoid@^3": "3.3.18"
  "picomatch@<3": "2.3.2"
  "picomatch@>=4 <4.0.4": "4.0.4"
  postcss: "8.5.26"
  rollup: "4.63.1"
  sharp: "0.35.4"
  shell-quote: "1.10.0"
  tar: "7.5.22"
  tmp: "0.2.7"
  vite: "6.4.3"
  "yaml@1": "1.10.3"
  zod: "3.25.76"

packageExtensions:
  "@strapi/design-system":
    dependencies:
      codemirror: "^6.0.2"
  framer-motion:
    peerDependencies:
      "@types/react": "*"
  "@strapi/blocks-react-renderer":
    peerDependencies:
      "@types/react": "*"

allowBuilds:
  "@swc/core": true
  better-sqlite3: true
  core-js: false
  core-js-pure: false
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
