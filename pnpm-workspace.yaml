packages:
  - "apps/*"
  - "packages/*"

# Latest-compatible floors. Keep majors that Strapi/admin still require
# (vite 6, zod 3, js-yaml 4, markdown-it 14, hono 4 / @hono/node-server 1, yaml 1).
#
# Dependency override policy (issue #13):
# - Temporary (drop after the next Strapi/MCP release that ships the floor):
#   hono, @hono/node-server, tar, vite, sharp
# - Floor pins kept even when current Strapi already matches, so a transitive
#   rollback cannot reintroduce a high finding: fast-uri, nanoid, ip-address
# - Broader supply-chain floors (keep until unused in `pnpm why`):
#   brace-expansion, esbuild, lodash, postcss, js-yaml, etc.
# Do not weaken CI `pnpm audit:security` without a written exception (patches/README.md).
overrides:
  "@hono/node-server": "1.19.17"
  "@uiw/react-codemirror>codemirror": "^6.0.2"
  brace-expansion: "5.0.12"
  browserslist: "4.29.4"
  esbuild: "0.28.2"
  fast-uri: "3.1.9"
  fast-xml-parser: "5.11.2"
  flatted: "3.4.4"
  handlebars: "4.7.10"
  hono: "4.13.13"
  ip-address: "10.7.4"
  js-yaml: "4.3.2"
  linkify-it: "5.0.2"
  lodash: "4.18.1"
  lodash-es: "4.18.1"
  markdown-it: "14.3.3"
  minimatch: "10.2.6"
  "nanoid@^3": "3.3.20"
  nodemailer: "10.1.7"
  "picomatch@<3": "2.3.2"
  "picomatch@>=4 <4.0.7": "4.0.7"
  postcss: "8.5.31"
  rollup: "4.64.12"
  sharp: "0.35.5"
  shell-quote: "1.12.0"
  tar: "7.5.22"
  tmp: "0.2.7"
  vite: "6.4.4"
  webpack: "5.112.0"
  webpack-dev-middleware: "8.5.0"
  "yaml@1": "1.10.3"
  zod: "3.25.76"

packageExtensions:
  "@strapi/design-system":
    dependencies:
      codemirror: "^6.0.2"
  framer-motion:
    peerDependencies:
      "@types/react": "*"
  "@strapi/blocks-react-renderer":
    peerDependencies:
      "@types/react": "*"

allowBuilds:
  "@swc/core": true
  better-sqlite3: true
  core-js: false
  core-js-pure: false
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - tar@7.5.22
  - js-yaml@4.3.2
  - '@hono/node-server@1.19.17'
  - yaml@1.10.3
  - '@types/react-dom@19.3.0'
  - 'fast-uri@3.1.9'
  - '@rollup/rollup-android-arm-eabi@4.64.12'
  - '@rollup/rollup-android-arm64@4.64.12'
  - '@rollup/rollup-darwin-arm64@4.64.12'
  - '@rollup/rollup-darwin-x64@4.64.12'
  - '@rollup/rollup-freebsd-arm64@4.64.12'
  - '@rollup/rollup-freebsd-x64@4.64.12'
  - '@rollup/rollup-linux-arm-gnueabihf@4.64.12'
  - '@rollup/rollup-linux-arm-musleabihf@4.64.12'
  - '@rollup/rollup-linux-arm64-gnu@4.64.12'
  - '@rollup/rollup-linux-arm64-musl@4.64.12'
  - '@rollup/rollup-linux-loong64-gnu@4.64.12'
  - '@rollup/rollup-linux-loong64-musl@4.64.12'
  - '@rollup/rollup-linux-ppc64-gnu@4.64.12'
  - '@rollup/rollup-linux-ppc64-musl@4.64.12'
  - '@rollup/rollup-linux-riscv64-gnu@4.64.12'
  - '@rollup/rollup-linux-riscv64-musl@4.64.12'
  - '@rollup/rollup-linux-s390x-gnu@4.64.12'
  - '@rollup/rollup-linux-x64-gnu@4.64.12'
  - '@rollup/rollup-linux-x64-musl@4.64.12'
  - '@rollup/rollup-openbsd-x64@4.64.12'
  - '@rollup/rollup-openharmony-arm64@4.64.12'
  - '@rollup/rollup-win32-arm64-msvc@4.64.12'
  - '@rollup/rollup-win32-ia32-msvc@4.64.12'
  - '@rollup/rollup-win32-x64-gnu@4.64.12'
  - '@rollup/rollup-win32-x64-msvc@4.64.12'
  - 'rollup@4.64.12'

patchedDependencies:
  '@strapi/strapi@5.58.0': patches/@strapi__strapi@5.58.0.patch
  braces@3.0.3: patches/braces@3.0.3.patch
