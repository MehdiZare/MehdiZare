packages:
  - "apps/*"
  - "packages/*"

# Latest-compatible floors. Keep majors that Strapi/admin still require
# (vite 6, zod 3, js-yaml 4, markdown-it 14, hono 4 / @hono/node-server 1, yaml 1).
#
# Dependency override policy (issue #13):
# - Temporary (drop after the next Strapi/MCP release that ships the floor):
#   hono, @hono/node-server, tar, vite, sharp
# - Floor pins kept even when current Strapi already matches, so a transitive
#   rollback cannot reintroduce a high finding: fast-uri, follow-redirects, nanoid, ip-address
# - Broader supply-chain floors (keep until unused in `pnpm why`):
#   brace-expansion, esbuild, lodash, postcss, js-yaml, etc.
# Do not weaken CI `pnpm audit:security` without a written exception (patches/README.md).
overrides:
  "@hono/node-server": "1.19.18"
  "@uiw/react-codemirror>codemirror": "^6.0.2"
  brace-expansion: "5.0.12"
  browserslist: "4.29.5"
  dompurify: "3.4.17"
  esbuild: "0.28.2"
  fast-uri: "3.1.9"
  fast-xml-parser: "5.12.0"
  flatted: "3.4.4"
  follow-redirects: "1.16.3"
  handlebars: "4.7.10"
  hono: "4.13.17"
  ip-address: "10.7.6"
  js-yaml: "4.3.2"
  linkify-it: "5.0.2"
  lodash: "4.18.1"
  lodash-es: "4.18.1"
  markdown-it: "14.3.3"
  minimatch: "10.2.6"
  "nanoid@^3": "3.3.20"
  nodemailer: "10.3.1"
  "picomatch@<3": "2.3.2"
  "picomatch@>=4 <4.0.7": "4.0.7"
  postcss: "8.5.32"
  rollup: "4.68.2"
  sharp: "0.35.5"
  shell-quote: "1.12.0"
  tar: "7.5.22"
  tmp: "0.2.7"
  "undici@>=6.23.0 <6.29.1": "6.29.1"
  vite: "6.4.6"
  webpack: "5.112.2"
  webpack-dev-middleware: "8.6.0"
  "yaml@1": "1.10.3"
  "zod@3": "3.25.76"
  "zod@4": "4.6.7"

packageExtensions:
  "@strapi/design-system":
    dependencies:
      codemirror: "^6.0.2"
  framer-motion:
    peerDependencies:
      "@types/react": "*"
  "@strapi/blocks-react-renderer":
    peerDependencies:
      "@types/react": "*"

allowBuilds:
  "@swc/core": true
  better-sqlite3: true
  core-js: false
  core-js-pure: false
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - tar@7.5.22
  - js-yaml@4.3.2
  - '@hono/node-server@1.19.18'
  - yaml@1.10.3
  - '@types/react-dom@19.3.0'
  - 'fast-uri@3.1.9'

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
