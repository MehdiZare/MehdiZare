$schema: https://railway.com/railway.schema.json

services:
  cms:
    builder: DOCKERFILE
    dockerfilePath: apps/cms/Dockerfile
    rootDirectory: /
    healthcheckPath: /_health
    healthcheckTimeout: 300
    startCommand: pnpm start
    variables:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_URL: ${{Postgres.DATABASE_URL}}
      APP_KEYS: ${{shared.APP_KEYS}}
      API_TOKEN_SALT: ${{shared.API_TOKEN_SALT}}
      ADMIN_JWT_SECRET: ${{shared.ADMIN_JWT_SECRET}}
      TRANSFER_TOKEN_SALT: ${{shared.TRANSFER_TOKEN_SALT}}
      ENCRYPTION_KEY: ${{shared.ENCRYPTION_KEY}}
      JWT_SECRET: ${{shared.JWT_SECRET}}
